# Workflow testing the latest released action, to catch regressions in what consumers pick up
# on multiple operating systems.

name: Test Released Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

jobs:
  test:
    permissions:
      actions: write
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Test action to cancel stale queued runs
        uses: durandtibo/cancel-queued-runs-action@3f57ce49d16e0e14e7dd4aed984ff77470d8e357 # ratchet:durandtibo/cancel-queued-runs-action@v1.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}

  test-48h:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test action to cancel stale queued runs (max age 48h)
        uses: durandtibo/cancel-queued-runs-action@3f57ce49d16e0e14e7dd4aed984ff77470d8e357 # ratchet:durandtibo/cancel-queued-runs-action@v1.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          max_age_hours: 48
