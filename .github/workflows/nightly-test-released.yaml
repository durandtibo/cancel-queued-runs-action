# Workflow testing the latest released action, to catch regressions in what consumers pick up
# on multiple operating systems. It mirrors the tests of ci-action.yaml, which tests the
# current checkout instead. Update the pinned release below when a new version is released.

name: Test Released Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  test:
    permissions:
      actions: write
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Test action to cancel stale queued runs
        uses: durandtibo/cancel-queued-runs-action@b5f191982afc3b7cbe8797f1a2033bdd634324ce # ratchet:durandtibo/cancel-queued-runs-action@v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}

  test-48h:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test action to cancel stale queued runs (max age 48h)
        uses: durandtibo/cancel-queued-runs-action@b5f191982afc3b7cbe8797f1a2033bdd634324ce # ratchet:durandtibo/cancel-queued-runs-action@v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          max_age_hours: 48

  # Check the wiring of the released action.yaml (inputs passed to the script, outputs exposed
  # by the action), which the unit tests of the script cannot see
  test-outputs:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # A dry run never cancels anything, whatever the runs of the repository are
      - name: Dry run of the action with all the statuses
        id: dry-run
        uses: durandtibo/cancel-queued-runs-action@b5f191982afc3b7cbe8797f1a2033bdd634324ce # ratchet:durandtibo/cancel-queued-runs-action@v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          max_age_hours: 1
          statuses: queued,waiting,pending,requested
          max_cancellations: 1
          dry_run: true

      - name: Check the outputs of the dry run
        env:
          FOUND_COUNT: ${{ steps.dry-run.outputs.found_count }}
          CANCELLED_COUNT: ${{ steps.dry-run.outputs.cancelled_count }}
          SKIPPED_COUNT: ${{ steps.dry-run.outputs.skipped_count }}
          FAILED_COUNT: ${{ steps.dry-run.outputs.failed_count }}
          WOULD_CANCEL_COUNT: ${{ steps.dry-run.outputs.would_cancel_count }}
          DEFERRED_COUNT: ${{ steps.dry-run.outputs.deferred_count }}
          CANCELLED_RUN_IDS: ${{ steps.dry-run.outputs.cancelled_run_ids }}
          LISTING_TRUNCATED: ${{ steps.dry-run.outputs.listing_truncated }}
          # the value of max_cancellations of the step above
          MAX_CANCELLATIONS: 1
        run: |
          ./dev/check_dry_run_outputs.sh

      # The error annotation of this step is expected: the step must fail
      - name: Run the action with an invalid input
        id: invalid-input
        continue-on-error: true
        uses: durandtibo/cancel-queued-runs-action@b5f191982afc3b7cbe8797f1a2033bdd634324ce # ratchet:durandtibo/cancel-queued-runs-action@v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          max_age_hours: not-a-number
          dry_run: true

      - name: Check that the invalid input failed the step
        env:
          OUTCOME: ${{ steps.invalid-input.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::An invalid max_age_hours must fail the action (outcome: '$OUTCOME')"
            exit 1
          fi
          echo "✅ The invalid input failed the action"
