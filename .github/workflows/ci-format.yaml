# Formatting and linting workflow.
# Checks the Markdown, shell and YAML files of the repository, and the assertions of
# the bats tests.

name: Format
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  format:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Format
        run: |
          make format

      - name: Check for changes
        run: |
          git diff --exit-code

  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Lint
        run: |
          make lint
