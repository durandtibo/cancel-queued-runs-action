# Formatting and linting workflow.
# Checks the Markdown, shell and YAML files of the repository, and the assertions of
# the bats tests.

name: Format
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Lint Markdown files
        run: |
          make lint-markdown

      - name: Check shell formatting
        run: |
          make check-format-shell

      - name: Lint shell scripts
        run: |
          make lint-shell

      - name: Lint YAML files
        run: |
          make lint-yaml

      - name: Check the bats assertions
        run: |
          make lint-bats
