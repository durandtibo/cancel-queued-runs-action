# Workflow testing the action in a real workflow. One file tests both versions:
#   - use-released: false (default, called by ci.yaml): the action from the current checkout
#     (uses: ./), i.e. the version that is not released yet.
#   - use-released: true (called by nightly.yaml): the latest released action, to catch
#     regressions in what consumers pick up. Update the pinned release below when a new
#     version is released (bot-pin-action.yaml does it).
# Every job has one step per version, selected by `if`, and one shared verify step that calls
# dev/check_action_case.sh, so the two runs cannot drift apart. A step that was skipped has no
# outputs: the verify steps read `steps.local.outputs.x || steps.released.outputs.x`.
#
# The jobs use the real gh and the real API with the job's token, never a fake. The wiring of an
# input is proven by a row with an invalid value: it can only fail if the input reached the
# script. The effect of an input (a filter, a real cancel) is a unit test (tests/, fake gh).
#
# No job cancels a real run: every run of the action here is a dry run, or fails in its
# validation or its listing before cancelling anything. A real cancel changes the repository, so
# it is covered by the unit tests (the fake gh, tests/) and, in production, by
# bot-cancel-stale-queued-runs.yaml, which runs the released action every hour on this repository:
# a failing real cancel fails that workflow.
#
# Two levels of tests:
#   - general behaviour (`test`): the default usage, as a dry run, on every OS of the matrix
#   - edge cases (`test-cases`): one row of tests/action_cases.json per matrix cell, on one runner.
#     A new case is a new row, not a new job. A row has "released": false until the last release
#     has the feature (the released run skips those rows). A row that expects a failure follows a
#     positive run on the same runner, so that it cannot fail for the wrong reason.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
      use-released:
        description: "Test the latest released action instead of the current checkout"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      use-released:
        description: "Test the latest released action instead of the current checkout"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  get-matrix:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/lib-get-test-matrix.yaml
    permissions:
      contents: read

  # The cases of the edge case tests, as a matrix
  get-cases:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Read the cases
        id: cases
        run: echo "cases=$(jq -c . tests/action_cases.json)" >> "$GITHUB_OUTPUT"
        shell: bash

  # General behaviour: the default usage (as a dry run) on every OS of the matrix
  test:
    needs: get-matrix
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    permissions:
      actions: read
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Show the bash that runs the action
        run: bash --version | head -n 1
        shell: bash
      - name: Dry run of the action (local)
        id: local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          dry-run: true
      # The pinned release still has the v2 names (snake_case inputs and outputs). Once the
      # pinned release is v3.0.0, use the kebab-case names here and in the verify step.
      - name: Dry run of the action (released)
        id: released
        if: ${{ inputs.use-released }}
        uses: durandtibo/cancel-queued-runs-action@b5f191982afc3b7cbe8797f1a2033bdd634324ce # ratchet:durandtibo/cancel-queued-runs-action@v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          dry_run: true
      - name: Check the outputs
        env:
          CASE: '{"id":"default-dry-run","inputs":{"dry-run":"true"},"expect":"success"}'
          OUTCOME: success
          ELIGIBLE_COUNT: ${{ steps.local.outputs.eligible-count || steps.released.outputs.would_cancel_count }}
          CANCELLED_COUNT: ${{ steps.local.outputs.cancelled-count || steps.released.outputs.cancelled_count }}
          SKIPPED_COUNT: ${{ steps.local.outputs.skipped-count || steps.released.outputs.skipped_count }}
          FAILED_COUNT: ${{ steps.local.outputs.failed-count || steps.released.outputs.failed_count }}
          CANCELLED_RUN_IDS: ${{ steps.local.outputs.cancelled-run-ids || steps.released.outputs.cancelled_run_ids }}
        run: ./dev/check_action_case.sh
        shell: bash

  # Edge cases on one runner: one row of tests/action_cases.json per cell
  test-cases:
    needs: get-cases
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.get-cases.outputs.cases) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # A row that expects a failure follows a positive run on the same runner
      - name: Positive run before a failure case (local)
        if: ${{ !inputs.use-released && matrix.case.expect == 'failure' }}
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          dry-run: true
      - name: Positive run before a failure case (released)
        if: ${{ inputs.use-released && matrix.case.released && matrix.case.expect == 'failure' }}
        uses: durandtibo/cancel-queued-runs-action@b5f191982afc3b7cbe8797f1a2033bdd634324ce # ratchet:durandtibo/cancel-queued-runs-action@v2.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          dry-run: true

      # The case. A failure is expected for some rows: its error annotation is expected
      - name: Run the case (local)
        id: local
        if: ${{ !inputs.use-released }}
        continue-on-error: true
        uses: ./
        with:
          github-token: ${{ matrix.case.inputs['github-token'] || secrets.GITHUB_TOKEN }}
          repo: ${{ matrix.case.inputs.repo || github.repository }}
          max-age-hours: ${{ matrix.case.inputs['max-age-hours'] || '24' }}
          statuses: ${{ matrix.case.inputs.statuses || 'queued' }}
          workflow: ${{ matrix.case.inputs.workflow || '' }}
          branch: ${{ matrix.case.inputs.branch || '' }}
          event: ${{ matrix.case.inputs.event || '' }}
          force-cancel-buffer-hours: ${{ matrix.case.inputs['force-cancel-buffer-hours'] || '3' }}
          fail-on-error: ${{ matrix.case.inputs['fail-on-error'] || 'true' }}
          dry-run: ${{ matrix.case.inputs['dry-run'] || 'false' }}
      - name: Run the case (released)
        id: released
        if: ${{ inputs.use-released && matrix.case.released }}
        continue-on-error: true
        uses: durandtibo/cancel-queued-runs-action@b5f191982afc3b7cbe8797f1a2033bdd634324ce # ratchet:durandtibo/cancel-queued-runs-action@v2.0.0
        with:
          github-token: ${{ matrix.case.inputs['github-token'] || secrets.GITHUB_TOKEN }}
          repo: ${{ matrix.case.inputs.repo || github.repository }}
          max-age-hours: ${{ matrix.case.inputs['max-age-hours'] || '24' }}
          statuses: ${{ matrix.case.inputs.statuses || 'queued' }}
          workflow: ${{ matrix.case.inputs.workflow || '' }}
          branch: ${{ matrix.case.inputs.branch || '' }}
          event: ${{ matrix.case.inputs.event || '' }}
          force-cancel-buffer-hours: ${{ matrix.case.inputs['force-cancel-buffer-hours'] || '3' }}
          fail-on-error: ${{ matrix.case.inputs['fail-on-error'] || 'true' }}
          dry-run: ${{ matrix.case.inputs['dry-run'] || 'false' }}

      - name: Check the case
        if: ${{ !inputs.use-released || matrix.case.released }}
        env:
          CASE: ${{ toJson(matrix.case) }}
          OUTCOME: ${{ steps.local.outcome == 'skipped' && steps.released.outcome || steps.local.outcome }}
          ELIGIBLE_COUNT: ${{ steps.local.outputs.eligible-count || steps.released.outputs.eligible-count }}
          CANCELLED_COUNT: ${{ steps.local.outputs.cancelled-count || steps.released.outputs.cancelled-count }}
          SKIPPED_COUNT: ${{ steps.local.outputs.skipped-count || steps.released.outputs.skipped-count }}
          FAILED_COUNT: ${{ steps.local.outputs.failed-count || steps.released.outputs.failed-count }}
          CANCELLED_RUN_IDS: ${{ steps.local.outputs.cancelled-run-ids || steps.released.outputs.cancelled-run-ids }}
        run: ./dev/check_action_case.sh
        shell: bash
