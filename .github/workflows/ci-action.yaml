# Workflow testing the action on multiple operating systems. One file tests both versions:
#   - use-released: false (default, called by ci.yaml): the action from the current checkout
#     (uses: ./), i.e. the version that is not released yet.
#   - use-released: true (called by nightly.yaml): the latest released action, to catch
#     regressions in what consumers pick up. Update the pinned release below when a new
#     version is released (bot-pin-action.yaml does it).
# Every job has one step per version, selected by `if`, and one shared verify step, so the two
# runs cannot drift apart. A step that was skipped has no outputs: the verify steps read
# `steps.local.outputs.x || steps.released.outputs.x`.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
      use-released:
        description: "Test the latest released action instead of the current checkout"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      use-released:
        description: "Test the latest released action instead of the current checkout"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  # General behaviour: the default usage on every OS of the matrix
  get-matrix:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/lib-get-test-matrix.yaml
    permissions:
      contents: read

  test:
    needs: get-matrix
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    permissions:
      actions: write
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Test action to cancel stale queued runs (local)
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
      - name: Test action to cancel stale queued runs (released)
        if: ${{ inputs.use-released }}
        uses: durandtibo/cancel-queued-runs-action@b5f191982afc3b7cbe8797f1a2033bdd634324ce # ratchet:durandtibo/cancel-queued-runs-action@v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}

  # Edge case on one runner: the max_age_hours input
  test-48h:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Test action to cancel stale queued runs, max age 48h (local)
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          max-age-hours: 48
      - name: Test action to cancel stale queued runs, max age 48h (released)
        if: ${{ inputs.use-released }}
        uses: durandtibo/cancel-queued-runs-action@b5f191982afc3b7cbe8797f1a2033bdd634324ce # ratchet:durandtibo/cancel-queued-runs-action@v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          max_age_hours: 48

  # Edge cases on one runner: the wiring of action.yaml (inputs passed to the script, outputs
  # exposed by the action), which the unit tests of the script cannot see
  test-outputs:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # A dry run never cancels anything, whatever the runs of the repository are
      - name: Dry run of the action with all the statuses (local)
        id: local
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          max-age-hours: 1
          statuses: queued,waiting,pending,requested
          dry-run: true
      - name: Dry run of the action with all the statuses (released)
        id: released
        if: ${{ inputs.use-released }}
        uses: durandtibo/cancel-queued-runs-action@b5f191982afc3b7cbe8797f1a2033bdd634324ce # ratchet:durandtibo/cancel-queued-runs-action@v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          max_age_hours: 1
          statuses: queued,waiting,pending,requested
          dry_run: true

      # The outputs of the new script (eligible-count, ...) are not in the last release yet: the
      # check only runs on the local action. Step 5 of review/target_state.md replaces it with the cases table.
      - name: Check the outputs of the dry run
        if: ${{ !inputs.use-released }}
        env:
          ELIGIBLE_COUNT: ${{ steps.local.outputs.eligible-count }}
          CANCELLED_COUNT: ${{ steps.local.outputs.cancelled-count }}
          SKIPPED_COUNT: ${{ steps.local.outputs.skipped-count }}
          FAILED_COUNT: ${{ steps.local.outputs.failed-count }}
          CANCELLED_RUN_IDS: ${{ steps.local.outputs.cancelled-run-ids }}
        run: |
          ./dev/check_dry_run_outputs.sh

      # The error annotation of these steps is expected: the step must fail
      - name: Run the action with an invalid input (local)
        id: invalid-local
        if: ${{ !inputs.use-released }}
        continue-on-error: true
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          max-age-hours: not-a-number
          dry-run: true
      - name: Run the action with an invalid input (released)
        id: invalid-released
        if: ${{ inputs.use-released }}
        continue-on-error: true
        uses: durandtibo/cancel-queued-runs-action@b5f191982afc3b7cbe8797f1a2033bdd634324ce # ratchet:durandtibo/cancel-queued-runs-action@v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          max_age_hours: not-a-number
          dry_run: true

      - name: Check that the invalid input failed the step
        env:
          OUTCOME: ${{ steps.invalid-local.outcome == 'failure' && 'failure' || steps.invalid-released.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::An invalid max_age_hours must fail the action (outcome: '$OUTCOME')"
            exit 1
          fi
          echo "✅ The invalid input failed the action"
