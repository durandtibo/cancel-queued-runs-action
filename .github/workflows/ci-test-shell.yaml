# Shell unit tests workflow.
# Runs the bats tests of the shell scripts on multiple operating systems.

name: Shell Unit Tests
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install bats-core (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "📦 Installing bats-core..."
          sudo apt-get update -qq
          sudo apt-get install -y bats
          echo "✅ Installation complete"

      - name: Install bats-core (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "🍺 Installing bats-core..."
          brew update
          brew install bats-core
          echo "✅ Installation complete"

      - name: Verify bats installation
        run: |
          bats --version

      - name: Show the versions of bash and bats
        run: |
          bash --version | head -n 1
          bats --version

      - name: Run unit tests
        run: |
          echo "🧪 Running tests on ${{ matrix.os }}..."
          bats --recursive tests
          echo "✅ All tests passed"

      # The bash of macOS is 3.2, where a failing "[[ ]]" or "! cmd" that is not the
      # last command of a test does not fail it (see dev/check_bats_assertions.sh).
      # bats runs the tests with the first bash of the PATH, which may be a newer one
      # installed by Homebrew: run them again with the system bash.
      - name: Run unit tests with the system bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          system_bash_dir="$(mktemp -d)"
          ln -s /bin/bash "$system_bash_dir/bash"
          PATH="$system_bash_dir:$PATH" bash --version | head -n 1
          PATH="$system_bash_dir:$PATH" bats --recursive tests
          echo "✅ All tests passed with the system bash"
