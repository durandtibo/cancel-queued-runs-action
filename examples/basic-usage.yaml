# Basic usage.
# Cancels the runs of this repository that have been queued for more than 24 hours.
# Add the job to any workflow, or use it in a dedicated workflow like this one.

name: Basic usage

on:
  workflow_dispatch: # to trigger manually

permissions:
  actions: write # required to cancel the runs
  contents: read

jobs:
  cancel-stale-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: durandtibo/cancel-queued-runs-action@v1.9
        with:
          max_age_hours: 24
